name: Luna Continuous Integration & Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Test Luna Full Stack
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Frontend Pipeline
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      # Backend Pipeline
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Django Tests
        env:
          USE_SQLITE: 'true'
          GEMINI_API_KEY: 'mock_key'
          REDIS_URL: 'redis://localhost:6379/0'
        run: |
          python backend/manage.py test core

  deploy:
    name: Auto Deploy to Production (Fly.io / Render)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Standard Fly.io deployment step (Optional / Commented trigger)
      # To enable: Create a FLY_API_TOKEN secret in GitHub repository settings.
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io
        run: |
          # flyctl deploy --local-only
          echo "GitHub Actions build succeeded. Deploying to hosting node..."
