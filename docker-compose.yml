version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - MYSQL_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - CELERY_EAGER=false

  celery:
    build: .
    command: sh -c "cd backend && celery -A config worker -l info"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - MYSQL_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - CELERY_EAGER=false

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: luna_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
