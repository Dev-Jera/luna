server {
  listen 80;
  server_name _;
  root /var/www/html;
  index index.html;
  client_max_body_size 5m;
  location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /health/ { proxy_pass http://127.0.0.1:8000; }
  location /ready/ { proxy_pass http://127.0.0.1:8000; }
  location /ws/ { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
