components:
  schemas:
    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
      - authenticated
    ConnectionGoalEnum:
      enum:
      - friendship
      - romance
      - networking
      type: string
      description: |-
        * `friendship` - Friendship
        * `romance` - Romance
        * `networking` - Networking
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 160
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
          readOnly: true
        ai_enabled:
          type: boolean
        my_ai_consent:
          type: boolean
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          readOnly: true
      required:
      - id
      - messages
      - my_ai_consent
      - participants
      - unread_count
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        time:
          type: string
          format: date-time
      required:
      - service
      - status
      - time
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    Match:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        reasons: {}
        ai_explanation:
          type: string
        status:
          $ref: '#/components/schemas/MatchStatusEnum'
        conversation_id:
          type: integer
          readOnly: true
      required:
      - conversation_id
      - id
      - profile
    MatchStatusEnum:
      enum:
      - suggested
      - accepted
      - passed
      type: string
      description: |-
        * `suggested` - Suggested
        * `accepted` - Accepted
        * `passed` - Passed
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        body:
          type: string
        is_ai:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - sender
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
          nullable: true
        kind:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 160
        body:
          type: string
          maxLength: 240
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
    OperationalMetrics:
      type: object
      properties:
        profiles:
          type: integer
        onboarded_profiles:
          type: integer
        suggested_matches:
          type: integer
        accepted_matches:
          type: integer
        conversations:
          type: integer
        messages:
          type: integer
        open_reports:
          type: integer
      required:
      - accepted_matches
      - conversations
      - messages
      - onboarded_profiles
      - open_reports
      - profiles
      - suggested_matches
    PaginatedConversationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
    PaginatedMatchList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Match'
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedReportList:
      type: object
